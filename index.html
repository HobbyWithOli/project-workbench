<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Workbench</title>
<meta name="theme-color" content="#EEF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131A" media="(prefers-color-scheme: dark)">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single column workbench; overview (coming up + project cards) and a project detail view with stage blocks */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E3E6EE; --ink:#191D2B; --muted:#5A6276; --line:#D6DAE4;
  --accent:#2A3DA6; --accent-ink:#FFFFFF; --gold:#9A6C12; --gold-bg:#F6EBD3; --warn:#B03E25; --warn-bg:#F8E1DA; --ok:#2B7553; --ok-bg:#DCEFE5;
  --p-blue:#2A3DA6; --p-red:#B8323A; --p-gold:#B07F16; --p-green:#2F7D5B; --p-plum:#7B3F86; --p-teal:#1C7A84;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131A; --surface:#1A1D27; --sunk:#232735; --ink:#E7E9F1; --muted:#9AA1B5; --line:#2C3142;
  --accent:#8E9CFF; --accent-ink:#11131A; --gold:#E2B656; --gold-bg:#3A301A; --warn:#F28C70; --warn-bg:#3D211B; --ok:#6CC89C; --ok-bg:#1B3529;
  --p-blue:#8E9CFF; --p-red:#F07A80; --p-gold:#E2B656; --p-green:#6CC89C; --p-plum:#CC8ED8; --p-teal:#5CC6D0;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#1A1D27; --sunk:#232735; --ink:#E7E9F1; --muted:#9AA1B5; --line:#2C3142;
  --accent:#8E9CFF; --accent-ink:#11131A; --gold:#E2B656; --gold-bg:#3A301A; --warn:#F28C70; --warn-bg:#3D211B; --ok:#6CC89C; --ok-bg:#1B3529;
  --p-blue:#8E9CFF; --p-red:#F07A80; --p-gold:#E2B656; --p-green:#6CC89C; --p-plum:#CC8ED8; --p-teal:#5CC6D0;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.top h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:800;line-height:1}
.today{color:var(--muted);font-size:.85rem;margin-top:6px}
.save{font-size:.78rem;color:var(--muted);min-height:1.2em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:6px;color:var(--muted)}

section{margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:1.15rem;font-weight:800}

/* coming up */
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ag-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.ag-row:first-child{border-top:0}
.ag-row:hover{background:var(--sunk)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.ag-title{font-weight:700;min-width:0;overflow-wrap:anywhere}
.ag-proj{font-size:.82rem;color:var(--muted)}
.empty{padding:18px;color:var(--muted)}

/* chips */
.chip{font-family:var(--f-mono);font-size:.74rem;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.soon{background:var(--gold-bg);color:var(--gold)}
.chip.over{background:var(--warn-bg);color:var(--warn)}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.chip.ex{font-family:var(--f-body);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.64rem}

/* project cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card:hover{border-color:var(--pc)}
.card h3{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0}
.card h3 span{overflow-wrap:anywhere}
.card .meta{font-size:.85rem;color:var(--muted)}
.card.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-weight:700;min-height:120px;background:transparent}
.track{display:flex;gap:3px;height:8px}
.track i{flex:1;border-radius:2px;background:var(--sunk)}
.track i.on{background:var(--pc)}
.next{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;min-width:0}
.next{flex-wrap:wrap}
.next span:first-child{min-width:0;overflow-wrap:anywhere}

/* detail */
.back{margin-bottom:14px}
.p-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.p-name{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,5vw,2rem);border:0;background:transparent;width:100%;padding:0;line-height:1.15}
textarea.wrap{display:block;resize:none;overflow:hidden;field-sizing:content;min-height:0;white-space:pre-wrap;overflow-wrap:anywhere}
.p-about{border:1px solid transparent;background:var(--sunk);border-radius:8px;width:100%;padding:8px 10px;resize:vertical;min-height:2.6em;color:var(--ink)}
.p-about:focus{border-color:var(--line)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--pc);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc)}
.p-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.p-stats b{color:var(--ink);font-family:var(--f-mono)}

.stages{display:grid;gap:12px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.stage.is-done{opacity:.72}
.st-top{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:start}
.fold{border:0;background:transparent;color:var(--muted);width:26px;height:26px;margin-top:1px;border-radius:6px;display:grid;place-content:center;padding:0}
.fold:hover{background:var(--sunk);color:var(--ink)}
.fold svg{transition:transform .15s}
.is-folded .fold svg{transform:rotate(-90deg)}
.is-folded .steps{display:none}
.sec-tools{display:flex;gap:6px;align-items:center}
.check{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin:3px 0 0;display:grid;place-content:center;background:var(--surface);cursor:pointer;flex:none}
.check:checked{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent))}
.check:checked::after{content:"";width:10px;height:6px;border:solid var(--surface);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.st-title{font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.3;border:0;background:transparent;width:100%;padding:0}
.is-done .st-title{text-decoration:line-through}
.st-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;grid-column:3/5}
.date{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:4px 8px;font-family:var(--f-mono);font-size:.82rem}
.steps{display:grid;gap:2px;padding-left:32px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 8px;align-items:start}
.cam{align-self:start;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--muted);padding:5px 6px;border-radius:6px}
.cam:hover{color:var(--accent);background:var(--sunk)}
.cam svg{width:18px;height:18px;display:block}
.cam[disabled]{opacity:.5}
.thumbs{grid-column:2/5;display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 8px}
.thumb{position:relative;width:76px;height:76px;flex:none}
.thumb-open{display:block;width:100%;height:100%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-rm{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.9rem;line-height:1;padding:0;display:grid;place-items:center}
.thumb-rm:hover{color:var(--warn);border-color:var(--warn)}
.top-actions{display:flex;align-items:center;gap:10px}
.edit-note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:700;margin:-4px 0 12px}
.step .confirm{grid-column:2/5}
.lb{position:fixed;inset:0;background:rgba(10,12,18,.88);display:grid;place-items:center;padding:16px;z-index:50}
.lb[hidden]{display:none!important}
.lb img{max-width:100%;max-height:calc(100vh - 96px);border-radius:8px;display:block}
.lb-close{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;background:var(--surface);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font-weight:700}
.step .check{width:18px;height:18px;margin:6px 0 0;border-radius:5px}
.step .check:checked::after{width:8px;height:5px}
.step-text{border:0;background:transparent;width:100%;padding:4px 0;min-width:0;line-height:1.45}
.step.done .step-text{text-decoration:line-through;color:var(--muted)}
.x{align-self:start;border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--warn);background:var(--warn-bg)}
.add-step{border:0;border-bottom:1px dashed var(--line);background:transparent;padding:6px 0;width:100%;color:var(--ink)}
.add-step::placeholder,.new-row input::placeholder{color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-weight:700;font-size:.9rem}
.new-stage{border:1px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.new-row{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.step-form{margin:0}
.new-row input[type=text]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.muted{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:60ch}
.backup{margin-top:40px}
.danger-zone{margin-top:32px;display:flex;justify-content:flex-end}
.note{background:var(--gold-bg);color:var(--gold);border-radius:8px;padding:10px 12px;font-size:.88rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pc,var(--accent));color:var(--surface)}
.sec-head{flex-wrap:wrap}
.groups{display:grid;gap:10px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.g-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:12px 14px;border:0;background:transparent;text-align:left}
.g-head h3{font-size:1.05rem;font-weight:800}
.g-head .fold svg{transition:transform .15s}
.group:not(.open) .g-head .fold svg{transform:rotate(-90deg)}
.g-bar{grid-column:2/4;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--pc,var(--accent))}
.g-body{padding:0 14px 12px;display:grid;gap:12px}
.g-stage{display:grid;gap:2px}
.g-stage-name{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em;overflow-wrap:anywhere}
.g-hint{font-size:.85rem;color:var(--muted);margin:0 0 10px;max-width:60ch}
.group.all-done h3{color:var(--muted)}
.paints{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;overflow:hidden}
.pt-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:12px 16px;border:0;background:transparent;text-align:left}
.pt-head h2{font-size:1.1rem;font-weight:800}
.paints:not(.open) .pt-head .fold svg{transform:rotate(-90deg)}
.pt-body{padding:0 16px 14px;display:grid;gap:10px}
.pt-note{font-size:.85rem;color:var(--muted);margin:0;max-width:60ch}
.pt-list{display:grid;gap:8px}
.pt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pt-row:last-child{border-bottom:0;padding-bottom:0}
.pt-name{font-weight:700;overflow-wrap:anywhere}
.pt-tones{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pot{min-width:34px;height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--sunk);font-family:var(--f-mono);font-size:.85rem;padding:0 10px;color:var(--ink)}
.pot[aria-pressed="true"]{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent));color:var(--surface)}
.pt-sub{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.pt-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.g-paints{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.g-paints b{color:var(--ink)}
.st-paints{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;background:var(--sunk);border-radius:8px}
.st-paints .label{width:100%}
.sp{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.sp-name{font-size:.85rem;font-weight:700;overflow-wrap:anywhere}
.pot.sm{min-width:28px;height:28px;font-size:.78rem;padding:0 7px;background:var(--surface)}
.pot.sm[aria-pressed="true"]{background:var(--pc,var(--accent))}
.sp-sup{font-size:.82rem;color:var(--muted)}
.st-arms{width:46px;height:54px;flex:none;display:block}
.st-arms svg{width:100%;height:100%;display:block;overflow:visible}
@media (max-width:520px){
  .steps{padding-left:4px}
  .stage{padding:12px}
  .st-top{gap:8px}
  .st-meta{grid-column:1/5}
}
@media (prefers-reduced-motion:no-preference){.card,.ag-row,.btn{transition:border-color .15s,background .15s}}
</style>

</head><body>
<div class="wrap" id="app">
  <div class="top"><div><h1>Project Workbench</h1><div class="today">Loading your projects…</div></div></div>
  <section><div class="agenda"><div class="empty">Your upcoming deadlines and projects will appear here. Once loaded, tap “New project” to add one.</div></div></section>
</div>

<input type="file" id="photo-input" accept="image/*" hidden>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Reference photo"><button class="lb-close" id="lb-close">Close</button><img id="lb-img" alt="Reference photo"></div>
<script>
(function(){
const COLORS=["blue","red","gold","green","plum","teal"];
const app=document.getElementById("app");
let ready=false;
let projects={};                 // id -> project
const timers={};
let lastSaved=0, saveError="";
let ui={view:"home", confirm:null, importMsg:"", modes:{}, openGroups:{}};
try{const v=localStorage.getItem("pw-view"); if(v) ui.view=v;}catch(e){}
try{ui.modes=JSON.parse(localStorage.getItem("pw-modes")||"{}")||{};}catch(e){}
try{ui.openGroups=JSON.parse(localStorage.getItem("pw-groups")||"{}")||{};}catch(e){}
ui.pots={}; ui.paintsOpen={};
try{ui.pots=JSON.parse(localStorage.getItem("pw-pots")||"{}")||{};}catch(e){}
try{ui.paintsOpen=JSON.parse(localStorage.getItem("pw-paints-open")||"{}")||{};}catch(e){}
function saveUI(){try{localStorage.setItem("pw-modes",JSON.stringify(ui.modes));localStorage.setItem("pw-groups",JSON.stringify(ui.openGroups));
  localStorage.setItem("pw-pots",JSON.stringify(ui.pots));localStorage.setItem("pw-paints-open",JSON.stringify(ui.paintsOpen));}catch(e){}}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysUntil(iso){if(!iso)return null;const [y,m,d]=iso.split("-").map(Number);const t=new Date();const a=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((Date.UTC(y,m-1,d)-a)/864e5);}
function fmtDate(iso){if(!iso)return "";const [y,m,d]=iso.split("-").map(Number);const o={day:"numeric",month:"short"}; if(y!==new Date().getFullYear()) o.year="numeric"; return new Date(y,m-1,d).toLocaleDateString("en-GB",o);}
function stageDone(s){return !!s.done;}
function dueChip(s){
  if(stageDone(s)) return '<span class="chip done">Done</span>';
  const n=daysUntil(s.due); if(n===null) return '<span class="chip">No deadline</span>';
  if(n<0) return `<span class="chip over">${-n}d overdue</span>`;
  if(n===0) return '<span class="chip over">Due today</span>';
  if(n===1) return '<span class="chip soon">Tomorrow</span>';
  if(n<=7) return `<span class="chip soon">${n} days · ${fmtDate(s.due)}</span>`;
  return `<span class="chip">${fmtDate(s.due)} · ${n}d</span>`;
}
function sortStages(st){return [...st].sort((a,b)=>(stageDone(a)-stageDone(b))||((a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0));}
function list(){return Object.values(projects).sort((a,b)=>(a.order||0)-(b.order||0));}
function pc(p){return `--pc:var(--p-${COLORS.includes(p.color)?p.color:"blue"})`;}

/* ---------- saving (on this phone) ---------- */
const KEY="workbench-projects-v1";
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(projects));saveError="";lastSaved=Date.now();}
  catch(e){saveError="Couldn't save on this phone. Free up some storage and try again.";}
  setSaveLabel();
}
function scheduleSave(id,delay=400){
  clearTimeout(timers.all); timers.all=setTimeout(()=>{delete timers.all;persist();},delay); setSaveLabel();
}
function flush(){clearTimeout(timers.all);delete timers.all;persist();}
function setSaveLabel(){
  const el=document.getElementById("save"); if(!el) return;
  el.textContent=saveError||(timers.all?"Saving…":(lastSaved?"Saved on this phone":""));
}
window.addEventListener("pagehide",()=>{if(timers.all) flush();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&timers.all) flush();});

/* ---------- render ---------- */
function render(){
  const ae=document.activeElement, fid=ae&&ae.id, sel=(ae&&"selectionStart" in ae)?[ae.selectionStart,ae.selectionEnd]:null;
  const p=projects[ui.view];
  if(ui.view!=="home" && !p && ready) ui.view="home";
  app.innerHTML = (ui.view!=="home"&&p) ? detail(p) : home();
  fitAll();
  if(fid){const el=document.getElementById(fid); if(el){el.focus({preventScroll:true}); if(sel&&el.setSelectionRange){try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
  setSaveLabel();
}
function header(){
  const d=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return `<div class="top"><div><h1>Project Workbench</h1><div class="today">${d}</div></div>
  <div style="display:grid;justify-items:end;gap:6px"><button class="btn primary" data-act="new-project">+ New project</button><div class="save" id="save" aria-live="polite"></div></div></div>`;
}
function home(){
  const ps=list();
  if(!ready) return header()+`<section><div class="agenda"><div class="empty">Loading your projects…</div></div></section>`;
  const up=[];
  ps.forEach(p=>(p.stages||[]).forEach(s=>{if(!stageDone(s)&&s.due) up.push({p,s});}));
  up.sort((a,b)=>a.s.due<b.s.due?-1:1);
  const ag = up.length? up.slice(0,7).map(({p,s})=>`<button class="ag-row" style="${pc(p)}" data-act="open" data-id="${p.id}">
      <span class="dot"></span><span style="min-width:0"><div class="ag-title">${esc(s.title||"Untitled stage")}</div><div class="ag-proj">${esc(p.name)}</div></span>${dueChip(s)}</button>`).join("")
    : `<div class="empty">No upcoming deadlines. Open a project and give a stage a date.</div>`;
  const cards = ps.map(p=>{
    const st=p.stages||[], done=st.filter(stageDone).length;
    const nx=sortStages(st).find(s=>!stageDone(s));
    const track = st.length? `<div class="track" aria-label="${done} of ${st.length} ${LB(p).many} done">${sortStages(st).map(s=>`<i class="${stageDone(s)?"on":""}"></i>`).join("")}</div>`:`<div class="track"><i></i></div>`;
    return `<button class="card" style="${pc(p)}" data-act="open" data-id="${p.id}">
      <h3><span class="dot"></span><span>${esc(p.name||"Untitled project")}</span></h3>
      ${track}
      <div class="meta">${st.length?`${done} of ${st.length} ${LB(p).many} done`:`No ${LB(p).many} yet`}</div>
      ${nx?`<div class="next"><span>Next: ${esc(nx.title||"Untitled")}</span>${dueChip(nx)}</div>`:""}
    </button>`;}).join("");
  return header()+
   `<section><div class="sec-head"><h2>Coming up</h2><span class="label">${up.length} open deadline${up.length===1?"":"s"}</span></div><div class="agenda">${ag}</div></section>
    <section><div class="sec-head"><h2>Projects</h2><span class="label">${ps.length}</span></div>
    <div class="cards">${cards}<button class="card add" data-act="new-project">+ New project</button></div></section>
    <section class="backup"><div class="sec-head"><h2>Backup</h2></div>
      <p class="muted">Your projects are saved on this phone only. Save a backup file now and then, so you can restore everything if you reinstall the app or switch phones.</p>
      <div class="new-row"><button class="btn" data-act="export">Save backup file</button>
      <label class="btn" for="import-file">Restore from backup</label><input type="file" id="import-file" accept="application/json,.json" hidden></div>
      ${ui.importMsg?`<div class="note" style="margin-top:10px">${esc(ui.importMsg)}</div>`:""}
    </section>`;
}
function detail(p){

  return `<div class="top" style="margin-bottom:12px"><button class="btn ghost back" data-act="back">← All projects</button><div class="top-actions"><div class="save" id="save" aria-live="polite"></div><button class="btn ${ui.edit?"primary":""}" data-act="edit" aria-pressed="${ui.edit?"true":"false"}">${ui.edit?"Done":"Edit"}</button></div></div>

    <textarea class="p-about" id="p-about" data-f="about" rows="2" placeholder="What is this project? Add a goal or notes" aria-label="Project notes">${esc(p.about)}</textarea>
    <div class="swatches"><span class="label" style="margin-right:4px">Colour</span>${sw}</div>
    <div class="swatches"><span class="label" style="margin-right:4px">Call them</span><div class="seg" role="group" aria-label="Call them"><button data-act="label" data-v="stages" aria-pressed="${p.unitLabel!=="units"}">Stages</button><button data-act="label" data-v="units" aria-pressed="${p.unitLabel==="units"}">Units/models</button></div></div>
    <div class="p-stats"><span>${LB(p).count} <b>${done}/${st.length}</b></span><span>Steps <b>${sdone}/${steps.length}</b></span>${nx?`<span>Next deadline <b>${fmtDate(nx.due)}</b></span>`:""}</div>
  </div>

  <section style="${pc(p)}"><div class="sec-head"><h2>${mode==="groups"?"Steps by task":LB(p).heading}</h2><div class="sec-tools">
      ${steps.length?`<div class="seg" role="group" aria-label="View"><button data-act="mode" data-v="stages" aria-pressed="${mode==="stages"}">Stages</button><button data-act="mode" data-v="groups" aria-pressed="${mode==="groups"}">By task</button></div>`:""}
      ${st.length&&mode==="stages"?`<button class="btn" data-act="fold-all" data-v="${st.every(s=>s.collapsed)?"0":"1"}">${st.every(s=>s.collapsed)?"Expand all":"Collapse all"}</button>`:""}</div></div>
    ${mode==="groups"?groupsHTML(p):`<div class="stages">${stages}</div>`}
    <div class="new-stage" style="margin-top:12px">
      <span class="label">Add a ${LB(p).one}</span>
      <form class="new-row" id="ns-form" autocomplete="off"><input type="text" id="ns-title" enterkeyhint="enter" placeholder="${LB(p).One} name, e.g. ${LB(p).eg}" aria-label="New ${LB(p).one} name">
      <input type="date" class="date" id="ns-due" aria-label="New stage deadline">
      <button class="btn primary" type="submit">Add ${LB(p).one}</button></form>
    </div>
  </section>
  ${ui.edit?`<div class="danger-zone">${ui.confirm==="project"
    ?`<div class="confirm">Delete “${esc(p.name)}” and all its stages? <button class="btn danger" data-act="del-project-yes">Delete project</button><button class="btn" data-act="cancel">Keep it</button></div>`
    :`<button class="btn danger" data-act="del-project">Delete project</button>`}</div>`:""}`;

/* ---------- paints list ---------- */
// Reads paint names and tone numbers out of step text, e.g. "Lustria Green 3, shade 1-2, highlight 4-5".
const LEAD=new Set("Base Basecoat Layer Shade Highlight Highlights Glaze Glint Prime Paint Drybrush Edge Muzzle Points Fill Soften Sketch Stipple Whole Light Very Optional Then Mix Wash Apply Dot Dab Undercoat The".split(" "));
const NAME_RE=/([A-Z][a-z'][A-Za-z']*(?: (?:of |the )?[A-Z][a-z'][A-Za-z']*)*) (\d)(?:\s*(?:-|to)\s*(\d))?(?![\dx.]|mm)/g;
const MORE_RE=/\s*[,;]?\s*(?:shade|highlight|edge|layer|then|and)?\s*(\d)(?:\s*(?:-|to)\s*(\d))?(?![\dx.]|mm)/y;
const SUPPLIES=[["Shading Medium",/shading medium/i],["Blending Medium",/blending medium/i],["Gloss varnish",/gloss varnish/i],["Matt varnish",/matt varnish/i],
  ["Mud texture paste",/texture paste/i],["Fine sand and small stones",/fine sand|small stones/i],["PVA glue",/\bPVA\b/],["Static grass (2-4mm)",/static grass/i],
  ["Tufts or flowers",/\btufts\b/i],["Masking tape",/\btape\b/i],["Pencil",/\bpencil\b/i],["Toothpick",/toothpick/i],["Drybrush brush",/drybrush/i]];
function addTones(set,a,b){a=+a;b=b==null?a:+b;if(b<a)[a,b]=[b,a];for(let i=a;i<=b&&i<=9;i++)set.add(i);}
function paintsFrom(texts){
  const paints=new Map(), supplies=new Set();
  texts.forEach(tx=>{
    NAME_RE.lastIndex=0; let m;
    while((m=NAME_RE.exec(tx))){
      let words=m[1].split(" "); while(words.length&&LEAD.has(words[0])) words.shift();
      if(words[0]==="of"||words[0]==="the") words.shift();
      if(!words.length) continue;
      const name=words.join(" "); if(!paints.has(name)) paints.set(name,new Set());
      const set=paints.get(name); addTones(set,m[2],m[3]);
      MORE_RE.lastIndex=NAME_RE.lastIndex; let n;
      while((n=MORE_RE.exec(tx))){addTones(set,n[1],n[2]); NAME_RE.lastIndex=MORE_RE.lastIndex;}
    }
    SUPPLIES.forEach(([nm,re])=>{if(re.test(tx)) supplies.add(nm);});
  });
  const list=[...paints.entries()].map(([name,set])=>({name,tones:[...set].sort((a,b)=>a-b)})).sort((a,b)=>a.name.localeCompare(b.name));
  return {list, supplies:SUPPLIES.map(x=>x[0]).filter(n=>supplies.has(n))};
}
function toneText(t){const out=[];for(let i=0;i<t.length;i++){let j=i;while(j+1<t.length&&t[j+1]===t[j]+1)j++;out.push(j>i+1?t[i]+"–"+t[j]:j===i+1?t[i]+", "+t[j]:""+t[i]);i=j;}return out.join(", ");}
function openSteps(p){const out=[];(p.stages||[]).forEach(s=>{if(s.done)return;(s.steps||[]).forEach(t=>{if(!t.done) out.push(t.text||"");});});return out;}
function paintsHTML(p){
  const {list,supplies}=paintsFrom(openSteps(p));
  if(!list.length&&!supplies.length) return "";
  const isOpen=!!ui.paintsOpen[p.id], got=ui.pots[p.id]||{};
  const keys=[...list.flatMap(x=>x.tones.map(t=>x.name+"|"+t)),...supplies];
  const out=keys.filter(k=>got[k]).length;
  let body="";
  if(isOpen){
    body=`<div class="pt-body"><p class="pt-note">Every paint and tone used in the steps you haven't ticked off yet. Tap each pot as you get it out.</p>
      <div class="pt-list">${list.map(x=>`<div class="pt-row"><span class="pt-name">${esc(x.name)}</span><span class="pt-tones">${x.tones.map(t=>{const k=x.name+"|"+t;return `<button class="pot" data-act="pot" data-k="${esc(k)}" aria-pressed="${!!got[k]}" aria-label="${esc(x.name)} ${t}">${t}</button>`;}).join("")}</span></div>`).join("")}</div>
      ${supplies.length?`<div class="pt-sub">Mediums &amp; supplies</div><div class="pt-list">${supplies.map(n=>`<div class="pt-row"><span class="pt-name">${esc(n)}</span><span class="pt-tones"><button class="pot" data-act="pot" data-k="${esc(n)}" aria-pressed="${!!got[n]}" aria-label="${esc(n)}">✓</button></span></div>`).join("")}</div>`:""}
      <div class="pt-tools"><span class="pt-note">${out} of ${keys.length} out</span>${out?`<button class="btn" data-act="pots-clear">Clear ticks</button>`:""}</div></div>`;
  }
  return `<div class="paints ${isOpen?"open":""}" style="${pc(p)}">
    <button class="pt-head" data-act="paints" aria-expanded="${isOpen}"><span class="fold" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h2>All paints for this project</h2><span class="chip">${list.length} paints · ${list.reduce((a,x)=>a+x.tones.length,0)} pots</span></button>${body}</div>`;
}

/* ---------- grouping steps by task ---------- */
// Rules run in order; the first match wins. Each tests the step text, then (where noted) the stage name.
const GROUPS=[
  {name:"Plans & colour schemes", t:/^(scheme|duke colours|heraldry:|decide|keep gold trim|banner carries|purchase|buy)/i},
  {name:"Basing", s:/basing/i, t:/static grass|base rims?\b|texture paste|matt varnish/i},
  {name:"Priming", t:/^prime\b|\bprime (rider|horse|grey|white|black)|undercoat|zenithal/i},
  {name:"Metallics", t:/metallic/i},
  {name:"Edge highlights & tidy-up", t:/^edge highlights?\b|tidy-up/i},
  {name:"Details & weathering", t:/^weathering|^details?\b|musician|champion|\bgems?\b|grail/i},
  {name:"Surcoats, tabards & caparisons", t:/surcoat|tabard|caparison|pennant/i},
  {name:"Banners", t:/banner/i},
  {name:"Horses", t:/horse|hoove?s?\b|mane|muzzle|nostril|^points\b/i, s:/\bhorses\b/i},
  {name:"Shields & heraldry", t:/shield|heraldry|fleur|chevron|roundel|annulet|torteaux|mullet|stars?\b|bordure|canton|chief|lozeng|chequy|quarters|wedge|saltire|\bcross\b|\bbend\b|\bfess\b|stripes?|grid|diamonds|wavy/i},
  {name:"Skin, faces & hair", t:/^(skin|lips|eyes|hair)\b/i},
  {name:"Cloth & bodies", t:/bod(y|ies)|dress|cloak|saddle cloth|hose|sleeves|undershirt|padding|plume|trim/i},
  {name:"Leather & wood", t:/leather|reins|belts|straps|boots|haft|pole|staff/i},
];
function groupOf(step,stage){
  if(step.group) return step.group;
  const tx=step.text||"", st=stage.title||"";
  for(const g of GROUPS){ if((g.t&&g.t.test(tx))||(g.s&&g.s.test(st))) return g.name; }
  return null;
}
function shortStage(t){t=t||"Untitled stage";const i=t.indexOf(":");return i>0&&i<30?t.slice(0,i):t;}
function viewMode(p){return (ui.modes&&ui.modes[p.id])||"stages";}
function groupsHTML(p){
  const order=GROUPS.map(g=>g.name), map=new Map();
  sortStages(p.stages||[]).forEach(s=>(s.steps||[]).forEach(t=>{
    const g=groupOf(t,s)||"Other: "+shortStage(s.title);
    if(!map.has(g)) map.set(g,[]); map.get(g).push({s,t});
  }));
  const keys=[...map.keys()].sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  if(!keys.length) return `<div class="empty" style="padding:4px 0">No steps yet. Add steps to your stages and they'll be grouped here by task.</div>`;
  const open=ui.openGroups[p.id]||{};
  return `<p class="g-hint">Every step from every ${LB(p).one}, grouped by what you're doing, so you can batch them: all the horses, then all the shields.</p><div class="groups">`+keys.map((g,gi)=>{
    const items=map.get(g), done=items.filter(x=>x.t.done).length, isOpen=!!open[g];
    let body="";
    if(isOpen){
      const byStage=new Map(); items.forEach(x=>{if(!byStage.has(x.s.id)) byStage.set(x.s.id,{s:x.s,ts:[]}); byStage.get(x.s.id).ts.push(x.t);});
      const gp=paintsFrom(items.filter(x=>!x.t.done&&!x.s.done).map(x=>x.t.text||""));
      const gpLine=(gp.list.length||gp.supplies.length)?`<div class="g-paints"><b>Paints:</b> ${gp.list.map(x=>esc(x.name)+" "+toneText(x.tones)).join(" · ")}${gp.supplies.length?(gp.list.length?" · ":"")+gp.supplies.map(esc).join(" · "):""}</div>`:"";
      body=`<div class="g-body">`+gpLine+[...byStage.values()].map(({s,ts})=>`<div class="g-stage"><div class="g-stage-name">${esc(s.title||"Untitled stage")}</div>`+
        ts.map(t=>`<div class="step ${t.done?"done":""}">
          <input type="checkbox" class="check" id="gck-${t.id}" data-act="toggle-step" data-s="${s.id}" data-t="${t.id}" ${t.done?"checked":""} aria-label="Step done">
          <textarea class="step-text wrap" rows="1" id="gtx-${t.id}" data-f="step" data-s="${s.id}" data-t="${t.id}" enterkeyhint="done" aria-label="Step">${esc(t.text)}</textarea><span></span><span></span>${photosHTML(s,t,false)}</div>`).join("")+`</div>`).join("")+`</div>`;
    }
    return `<div class="group ${isOpen?"open":""} ${done===items.length?"all-done":""}">
      <button class="g-head" data-act="group" data-g="${esc(g)}" aria-expanded="${isOpen}">
        <span class="fold" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <h3>${esc(g)}</h3><span class="chip ${done===items.length?"done":""}">${done}/${items.length}</span>
        <span></span><span class="g-bar"><i style="width:${items.length?Math.round(done/items.length*100):0}%"></i></span>
      </button>${body}</div>`;
  }).join("")+`</div>`;
}
function LB(p){return p&&p.unitLabel==="units"
  ?{one:"unit/model",many:"units/models",One:"Unit/model",heading:"Units &amp; models",count:"Units",eg:"10 Men at arms"}
  :{one:"stage",many:"stages",One:"Stage",heading:"Stages &amp; milestones",count:"Stages",eg:"Record pilot"};}
function stagePaintsHTML(p,s){
  if(s.done) return "";
  const {list,supplies}=paintsFrom((s.steps||[]).filter(t=>!t.done).map(t=>t.text||""));
  if(!list.length&&!supplies.length) return "";
  const got=ui.pots[p.id]||{};
  return `<div class="st-paints"><span class="label">Paints for this ${LB(p).one}</span>`+
    list.map(x=>`<span class="sp"><span class="sp-name">${esc(x.name)}</span>${x.tones.map(t=>{const k=x.name+"|"+t;return `<button class="pot sm" data-act="pot" data-k="${esc(k)}" aria-pressed="${!!got[k]}" aria-label="${esc(x.name)} ${t}">${t}</button>`;}).join("")}</span>`).join("")+
    (supplies.length?`<span class="sp-sup">Also: ${supplies.map(esc).join(", ")}</span>`:"")+`</div>`;
}
/* ---------- heraldry: a shield beside each knight (and the Duke's household) ---------- */
const ARMS=(()=>{
  const C={az:"#1f5aa6",or:"#e3b23c",gu:"#b8262d",ar:"#f2f2f0",sa:"#1e1e1e",ve:"#2e7d3e",pu:"#6b2d7b"};
  const F="M0 -18 C6 -10 6 -2 0 4 C-6 -2 -6 -10 0 -18 Z M-2 3 C-8 4 -15 0 -14 -8 C-13 -12 -9 -12 -8 -9 C-11 -8 -11 -3 -6 -1 Z M2 3 C8 4 15 0 14 -8 C13 -12 9 -12 8 -9 C11 -8 11 -3 6 -1 Z M-8 3 H8 V7 H-8 Z M-4 7 L0 16 L4 7 Z";

  const ST="M0 -10 L2.35 -3.24 L9.51 -3.09 L3.8 1.24 L5.88 8.09 L0 4 L-5.88 8.09 L-3.8 1.24 L-9.51 -3.09 L-2.35 -3.24 Z";

  const fl=(x,y,k,c,d=F)=>`<path transform="translate(${x},${y}) scale(${k})" fill="${c}" d="${d}"/>`;
  const star=(x,y,k,c)=>`<path transform="translate(${x},${y}) scale(${k})" fill="${c}" d="${ST}"/>`;
  const ln=(x1,y1,x2,y2,c,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
  const circ=(x,y,rr,c)=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="${c}"/>`;
  let cheq=r(0,0,110,132,C.az); for(let y=0;y<6;y++)for(let x=0;x<5;x++)if((x+y)%2===0)cheq+=r(x*22,y*22,22,22,C.or);
  let loz=r(0,0,110,130,C.ar); for(let y=-15;y<=135;y+=30)for(let x=0;x<=110;x+=22)loz+=`<path fill="${C.gu}" d="M${x},${y} l11,15 l-11,15 l-11,-15z"/>`;
  const scal=[[20,11],[34,11],[48,11],[62,11],[76,11],[90,11],[11,24],[11,38],[11,52],[11,66],[99,24],[99,38],[99,52],[99,66],[15,81],[25,95],[39,107],[55,115],[71,107],[85,95],[95,81]].map(([x,y])=>circ(x,y,5,C.pu)).join("");

  const A={
    kh01:duke,
    kh02:r(0,0,110,130,C.gu)+ln(-5,-6,115,136,C.or,24)+fl(82,34,1.1,C.ar)+fl(28,88,1.1,C.ar),
    kh03:r(0,0,55,65,C.sa)+r(55,0,55,65,C.ar)+r(0,65,55,65,C.ar)+r(55,65,55,65,C.sa)

function pdb(){
  if(photoDB) return photoDB;
  photoDB=new Promise((res,rej)=>{try{const r=indexedDB.open("workbench-photos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("photos");
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
  return photoDB;
}
function pdbDo(mode,fn){return pdb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("photos",mode);const st=tx.objectStore("photos");const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);}));}
const putPhoto=(id,blob)=>pdbDo("readwrite",st=>st.put(blob,id));
const getPhoto=id=>pdbDo("readonly",st=>st.get(id));
const delPhoto=id=>pdbDo("readwrite",st=>st.delete(id));
function photoSrc(ref){
  ref=String(ref||"");
  if(!ref.startsWith("idb:")) return /^[a-z0-9/_.-]+$/i.test(ref)?ref:"";
  const id=ref.slice(4);
  if(photoUrls[id]) return photoUrls[id];
  if(!photoLoading[id]){photoLoading[id]=1; getPhoto(id).then(b=>{if(b){photoUrls[id]=URL.createObjectURL(b);render();}}).catch(()=>{});}
  return "";
}
function photoUses(ref){return Object.values(projects).reduce((n,p)=>n+(p.stages||[]).reduce((m,s)=>m+(s.steps||[]).filter(t=>(t.images||[]).includes(ref)).length,0),0);}
function shrink(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>res(b||file),"image/jpeg",0.85);};
    img.onerror=()=>{URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}
function photosHTML(s,t,editable){
  const refs=t.images||[]; const pending=(ui.confirm||"").startsWith("photo:"+t.id+"|");
  if(!refs.length&&!pending) return "";

  const conf=pending&&editable?`<div class="confirm">Remove this photo? <button class="btn danger" data-act="del-photo-yes" data-s="${s.id}" data-t="${t.id}" data-ref="${esc(ui.confirm.split("|")[1])}">Remove</button><button class="btn" data-act="cancel">Keep it</button></div>`:"";

}

  if(a==="color"){p.color=b.dataset.c;scheduleSave(p.id,0);return render();}
  if(a==="toggle-stage"){const s=stage(p,b.dataset.s);s.done=b.checked;touch(s);scheduleSave(p.id,0);return render();}

// Phones submit the form from the keyboard's Enter key; desktop Enter goes through keydown.
app.addEventListener("submit",e=>{

      const list=KNIGHT_DETAIL[s.id]; if(!list) return;
      const old=s.steps||[], byId={}; old.forEach(t=>byId[t.id]=t);
      const done=id=>!!(byId[id]&&byId[id].done);
      const isGen=t=>/^kh\d\d(-|s\d\d$)/.test(t.id);
      const shieldOld=old.filter(t=>/^kh\d\ds\d\d$/.test(t.id)&&!/s99$/.test(t.id)&&!/^surcoat/i.test(t.text||""));
      const surOld=old.find(t=>/^surcoat/i.test(t.text||"")&&isGen(t));
      const shieldDone=shieldOld.length&&shieldOld.every(t=>t.done);
      const steps=list.map((text,i)=>{
        let d=false;
        if(/^Prime rider/.test(text)) d=done(s.id+"-prime");
        else if(/^Metallics first/.test(text)) d=done(s.id+"-metal");

  for(const id of refs){try{const b=await getPhoto(id); if(b) out[id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});}catch(e){}}
  return out;
}
async function exportBackup(){
  const photos=await photosForBackup();
  const data=JSON.stringify({app:"project-workbench",version:1,saved:new Date().toISOString(),projects,photos},null,2);
  const name="workbench-backup-"+todayISO()+".json";
  const blob=new Blob([data],{type:"application/json"});
  const file=typeof File==="function"?new File([blob],name,{type:"application/json"}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Project Workbench backup"}).catch(()=>download(blob,name));
  } else download(blob,name);
}
function download(blob,name){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
app.addEventListener("change",e=>{
  if(e.target.id!=="import-file") return;
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result); const ps=d&&d.projects;
      if(!ps||typeof ps!=="object") throw 0;
      projects={}; Object.entries(ps).forEach(([id,p])=>{projects[id]=Object.assign(p,{id,stages:p.stages||[]});});
      persist(); ui.importMsg="Restored "+Object.keys(projects).length+" projects from "+f.name+".";
      try{localStorage.removeItem("workbench-mig-maa-2026-11-07");}catch(e){} migrateMenAtArms1107();
      if(d.photos&&typeof d.photos==="object") Object.entries(d.photos).forEach(([id,u])=>{if(typeof u==="string"&&u.startsWith("data:image/")) fetch(u).then(r=>r.blob()).then(b=>putPhoto(id,b)).then(()=>{delete photoLoading[id];render();}).catch(()=>{});});
    }catch(err){ui.importMsg="That file isn't a Project Workbench backup. Choose a file saved with “Save backup file”.";}
    render();
  };
  r.readAsText(f);
});
load(); render();
if("serviceWorker" in navigator){
  const hadController=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController&&!reloaded){reloaded=true;if(timers.all) flush();location.reload();}});
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
})();
